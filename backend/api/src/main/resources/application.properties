spring.application.name=comprebem

# Porta do servidor
server.port=8080

# Configuração do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:comprebemdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Paginação do Spring Data Web (Padrão = 20, Limite Máximo = 50)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Configuração para disponibilizar o Swagger em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

